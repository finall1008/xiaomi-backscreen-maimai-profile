name: Release module

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Check release version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          node -e 'const m=require("./module.json"); if(process.env.GITHUB_REF_NAME !== "v"+m.version) throw Error("Tag must match module.json version")'

      - name: Install build dependencies
        run: npm ci

      - name: Test behavior
        run: npm test

      - name: Check committed Git-install artifacts
        run: npm run build:check

      - name: Package module ZIP
        run: npm run pack

      - name: Upload module artifact
        uses: actions/upload-artifact@v5
        with:
          name: MaimaiRearProfile-module
          path: dist/*.zip

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          generate_release_notes: true
