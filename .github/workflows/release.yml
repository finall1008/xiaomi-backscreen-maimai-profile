name: Release module

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Check release version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          node -e 'const m=require("./module.json"); if(process.env.GITHUB_REF_NAME !== "v"+m.version) throw Error("Tag must match module.json version")'

      - name: Install build dependencies
        run: npm ci

      - name: Test behavior
        run: npm test

      - name: Check committed Git-install artifacts
        run: npm run build:check

      - name: Package module ZIP
        run: npm run pack

      - name: Upload module artifact
        uses: actions/upload-artifact@v5
        with:
          name: MaimaiRearProfile-module
          path: dist/*.zip

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          generate_release_notes: true

      - name: Check module shop credentials
        if: startsWith(github.ref, 'refs/tags/')
        env:
          MODULE_STORE_TOKEN: ${{ secrets.MODULE_STORE_TOKEN }}
        run: |
          test -n "$MODULE_STORE_TOKEN" || { echo "::error::Set MODULE_STORE_TOKEN with Contents read/write access to finall1008/rear-card-modules"; exit 1; }

      - name: Checkout module shop publisher
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/checkout@v5
        with:
          repository: finall1008/rear-card-modules
          ref: main
          path: _module-store
          token: ${{ secrets.MODULE_STORE_TOKEN }}
          persist-credentials: false

      - name: Update module shop
        if: startsWith(github.ref, 'refs/tags/')
        env:
          MODULE_STORE_TOKEN: ${{ secrets.MODULE_STORE_TOKEN }}
        run: |
          python3 _module-store/scripts/publish-module.py \
            "dist/MaimaiRearProfile-${GITHUB_REF_NAME}.zip" \
            --repository "$GITHUB_REPOSITORY" --tag "$GITHUB_REF_NAME"
