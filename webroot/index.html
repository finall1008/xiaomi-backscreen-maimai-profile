<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>舞萌背屏 · 模块设置</title>
<script src="bridge-shim.js"></script>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<main class="page">
  <header class="page-head"><h1>舞萌背屏</h1></header>

  <section class="card">
    <div class="card-head"><h2>预览</h2></div>
    <div class="preview-wrap">
      <canvas id="preview" width="912" height="596" aria-label="背屏卡片预览"></canvas>
      <img class="preview-lens preview-lens-top" src="assets/lens-top.png" alt="" aria-hidden="true">
      <img class="preview-lens preview-lens-bottom" src="assets/lens-bottom.png" alt="" aria-hidden="true">
    </div>
    <dl class="facts">
      <div class="fact"><dt>昵称</dt><dd id="fact-name">—</dd></div>
      <div class="fact"><dt>称号</dt><dd id="fact-title">—</dd></div>
      <div class="fact"><dt>公开资料</dt><dd id="fact-public">尚未更新</dd></div>
      <div class="fact"><dt>完整资料</dt><dd id="fact-full">尚未更新</dd></div>
    </dl>
  </section>

  <section class="card">
    <div class="card-head"><h2>操作</h2></div>
    <div class="actions">
      <button id="refresh-public" type="button" class="btn">刷新公开资料</button>
      <button id="open-full" type="button" class="btn">更新完整资料 · 2 Token</button>
      <button id="check-in" type="button" class="btn">每日签到</button>
      <button id="retry-assets" type="button" class="btn" hidden>重试图片素材</button>
    </div>
    <p id="status" class="status" role="status">加载中…</p>
    <div id="error" class="banner banner-error" role="alert" hidden></div>
    <div id="notice" class="banner banner-note" hidden></div>
  </section>

  <section class="card" id="full-panel" hidden>
    <div class="card-head"><h2>更新完整资料</h2></div>
    <label class="field">
      <span>二维码内容或网页地址</span>
      <input id="full-qr" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="SGWC… 或二维码链接">
    </label>
    <div class="actions">
      <button id="full-cancel" type="button" class="btn">取消</button>
      <button id="full-confirm" type="button" class="btn btn-primary">确认更新 · 2 Token</button>
    </div>
  </section>

  <section class="card">
    <div class="card-head"><h2>设置</h2></div>
    <label class="field"><span>公开 QQ</span><input id="set-qq" type="text" inputmode="numeric" autocomplete="off" placeholder="QQ 号"></label>
    <label class="field"><span>网关令牌</span><input id="set-token" type="password" autocomplete="off" spellcheck="false" placeholder="gw_…"></label>
    <label class="field field-row"><span>自动刷新公开资料</span><input id="set-auto" type="checkbox"></label>
    <label class="field"><span>刷新间隔（分钟）</span><input id="set-interval" type="number" min="15" step="1" inputmode="numeric"></label>
    <div class="actions"><button id="save" type="button" class="btn btn-primary">保存</button></div>
  </section>

  <section class="card">
    <div class="card-head"><h2>致谢与数据来源</h2></div>
    <ul class="links">
      <li><a href="https://net.wmc.pub/" target="_blank" rel="noreferrer">AWMC NET.</a></li>
      <li><a href="https://api.wmc.pub/" target="_blank" rel="noreferrer">AWMC API</a></li>
      <li><a href="https://maimai.lxns.net/docs/api/maimai" target="_blank" rel="noreferrer">落雪公开资源</a></li>
      <li><a href="https://github.com/Yuri-YuzuChaN/maimaiDX" target="_blank" rel="noreferrer">maimaiDX</a></li>
      <li><a href="https://maimaidx.jp/" target="_blank" rel="noreferrer">官方 NET</a></li>
    </ul>
  </section>
</main>
<script src="main.js"></script>
</body>
</html>
